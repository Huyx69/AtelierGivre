<style>
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 56px;position:relative;z-index:2;}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin:0 0 14px;color:var(--accent);}
  .eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:var(--accent);}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(36px,6vw,62px);line-height:1.05;margin:0 0 16px;text-wrap:balance;}
  h1 em{font-style:italic;color:var(--accent);}
  p.lead{max-width:46ch;margin:0 auto 34px;font-size:16px;line-height:1.75;color:var(--corps);}
  .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:2px;font-size:13px;letter-spacing:1.3px;text-transform:uppercase;text-decoration:none;transition:background .3s,transform .3s,border-color .3s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .fine{margin:44px 0 0;font-size:12px;letter-spacing:.6px;color:var(--muet);}
  :root{--accent:#E1C27A;--corps:#C9D6CC;--muet:#8FA898;color-scheme:dark;}
  .logo{color:#FBF6EE;}
  .boule{width:min(190px,52vw);height:auto;margin-bottom:6px;overflow:visible;}
  .boule .pendule{transform-origin:95px 0;animation:balance 4.4s ease-in-out infinite alternate;}
  @keyframes balance{from{transform:rotate(-7deg);}to{transform:rotate(7deg);}}
  .btn.main{background:#A8232D;color:#fff;box-shadow:0 12px 28px -12px rgba(168,35,45,.8);}
  .btn.main:hover{background:#C4313B;}
  .btn.ghost{border:1px solid rgba(251,246,238,.45);color:#FBF6EE;background:rgba(255,255,255,.04);}
  .btn.ghost:hover{border-color:#FBF6EE;background:rgba(255,255,255,.1);}
  .noeud{width:18px;height:15px;}
  .sol{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:1;pointer-events:none;}
  #neige{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  @media (prefers-reduced-motion:reduce){.boule .pendule{animation:none;}}
</style>
</head>

    <linearGradient id="capuchon" x1="0" x2="1"><stop offset="0" stop-color="#9C7B33"/><stop offset=".45" stop-color="#F1D893"/><stop offset="1" stop-color="#A9873C"/></linearGradient>

<canvas id="neige" aria-hidden="true"></canvas>
<script>
(function () {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('neige'), ctx = cv.getContext('2d'), L, H, d = Math.min(2, devicePixelRatio || 1), f = [];
  function taille() { L = innerWidth; H = innerHeight; cv.width = L * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  taille(); addEventListener('resize', taille);
  for (var i = 0; i < (L < 600 ? 30 : 60); i++) f.push({ x: Math.random() * L, y: Math.random() * H, r: .8 + Math.random() * 2.2, v: .3 + Math.random() * .6, p: Math.random() * 6.3, a: .5 + Math.random() * .45 });
  (function tour(t) {
    ctx.clearRect(0, 0, L, H);
    for (var i = 0; i < f.length; i++) {
      var s = f[i]; s.y += s.v; s.x += Math.sin(t / 1800 + s.p) * .3;
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * L; }
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fillStyle = 'rgba(255,255,255,' + s.a + ')'; ctx.fill();
    }
    requestAnimationFrame(tour);
  })(0);
})();
</script>
