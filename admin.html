<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Atelier Givre — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
  :root{
    --bg:#F1F4F8; --surface:#fff; --surface-2:#F7F9FB; --ink:#18293A; --soft:#51616E;
    --muted:#8593A0; --line:#E3E9F0; --line2:#D2DBE4; --gold:#B8912F; --gold-soft:#F4ECD7;
    --navy:#18293A; --ok:#2C8158; --ok-soft:#E2F1E9; --alert:#9a3b2e; --alert-soft:#FBECEA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.55;}
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;}
  a{color:var(--gold);}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px 80px;}
  header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin:-24px -18px 22px;}
  header.top .b{display:flex;align-items:center;gap:10px;}
  header.top .b span.logo{color:var(--gold);font-size:20px;}
  header.top h1{font-size:22px;margin:0;}
  .who{font-size:12.5px;color:var(--muted);}
  button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:9px 14px;font-size:13.5px;transition:all .2s;}
  button:hover{border-color:var(--gold);}
  button.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  button.primary:hover{background:var(--gold);border-color:var(--gold);}
  button.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  button.danger{color:var(--alert);border-color:#e6c3bc;}
  button.danger:hover{background:var(--alert-soft);}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line2);border-radius:8px;padding:9px 11px;width:100%;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--gold);}
  label.fld{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 5px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}

  /* Login */
  .login{max-width:420px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:38px 32px;text-align:center;box-shadow:0 24px 48px -32px rgba(24,41,58,.45);}
  .login h1{font-size:30px;margin:0 0 6px;}
  .login p{color:var(--soft);margin:0 0 24px;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);
    border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;color:var(--ink);}
  .gbtn:hover{border-color:var(--gold);box-shadow:0 6px 18px -10px rgba(24,41,58,.4);}
  .gbtn svg{width:20px;height:20px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar h2{font-size:24px;margin:0;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden;
    box-shadow:0 18px 36px -30px rgba(24,41,58,.4);}
  .card.inactive{opacity:.62;}
  .chead{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;}
  .thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:linear-gradient(150deg,#F5F7FA,#E3EAF2);}
  .chead .t{flex:1;min-width:0;}
  .chead .t .nm{font-weight:600;}
  .chead .t .cat{font-size:12.5px;color:var(--muted);}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .badge.promo{background:var(--gold-soft);color:var(--gold);}
  .badge.off{background:var(--alert-soft);color:var(--alert);}
  .cbody{padding:4px 16px 18px;border-top:1px solid var(--line);display:none;}
  .card.open .cbody{display:block;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}
  .opts .opt{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .opts .opt input.lbl{flex:2;} .opts .opt input.prc{flex:1;max-width:110px;}
  .opts .opt button{padding:6px 10px;}
  .imgs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
  .imgs .im{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .imgs .im img{width:100%;height:100%;object-fit:cover;}
  .imgs .im button{position:absolute;top:2px;right:2px;padding:1px 6px;font-size:12px;background:rgba(255,255,255,.9);border-radius:6px;line-height:1.3;}
  .actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;}
  .msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);opacity:0;
    pointer-events:none;transition:opacity .25s;z-index:20;}
  .msg.show{opacity:1;} .msg.err{background:var(--alert);}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;}
  .switch input{width:auto;}
  #loading{text-align:center;color:var(--muted);padding:40px;}
</style>
</head>
<body>

<!-- Vue connexion -->
<div id="view-login" class="login" hidden>
  <h1>Atelier Givre</h1>
  <p>Espace de gestion — réservé à l'atelier.</p>
  <button class="gbtn" id="btn-google">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.7 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.8 6.1C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-3.9 6.7-9.7 6.7-17.4z"/><path fill="#FBBC05" d="M10.3 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.3-5.7c-2 1.4-4.7 2.3-8 2.3-6.4 0-11.8-3.7-13.7-9.9l-7.8 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
    Se connecter avec Google
  </button>
  <p id="login-err" style="color:var(--alert);font-size:13px;margin-top:16px;" hidden></p>
</div>

<!-- Vue dashboard -->
<div id="view-app" class="wrap" hidden>
  <header class="top">
    <div class="b"><span class="logo">❄</span><h1>Gestion des gâteaux</h1></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="who" id="who"></span>
      <button id="btn-logout">Déconnexion</button>
    </div>
  </header>

  <div class="toolbar">
    <h2>Catalogue</h2>
    <button class="gold" id="btn-new">+ Nouveau gâteau</button>
  </div>

  <div id="loading">Chargement…</div>
  <div id="list"></div>
</div>

<div id="msg" class="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://viuojsmxtvgxmajmpzge.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_sLOg6MB-rq1858Xw0kp9pw_eQou1lQl';
  // Emails autorisés à gérer le site (ajoute celui de ton pote ici + dans les règles Supabase).
  var ADMIN_EMAILS = ['ateliergivre.contact@gmail.com', 'tiago270106@gmail.com', 'givresebastien@gmail.com'];
  var CATEGORIES = ['Tartes & entremets','Cakes','Petits gâteaux','Confiserie'];

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var $ = function(s){ return document.querySelector(s); };
  var products = [];

  function toast(text, err){
    var m = $('#msg'); m.textContent = text; m.className = 'msg show' + (err ? ' err' : '');
    setTimeout(function(){ m.className = 'msg'; }, err ? 4200 : 2200);
  }
  function slugify(s){
    return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || ('produit-'+Date.now());
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── Authentification ──
  async function init(){
    var res = await sb.auth.getSession();
    handleSession(res.data.session);
    sb.auth.onAuthStateChange(function(_e, session){ handleSession(session); });
  }
  function handleSession(session){
    if(session && session.user){
      var email = (session.user.email||'').toLowerCase();
      if(ADMIN_EMAILS.map(function(e){return e.toLowerCase();}).indexOf(email) === -1){
        // Connecté mais non autorisé
        $('#view-login').hidden = false; $('#view-app').hidden = true;
        var le = $('#login-err'); le.hidden = false;
        le.textContent = 'Ce compte (' + email + ') n\'est pas autorisé. Déconnexion…';
        setTimeout(function(){ sb.auth.signOut(); }, 2500);
        return;
      }
      $('#view-login').hidden = true; $('#view-app').hidden = false;
      $('#who').textContent = email;
      loadProducts();
    } else {
      $('#view-login').hidden = false; $('#view-app').hidden = true;
    }
  }
  $('#btn-google').addEventListener('click', function(){
    sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href.split('#')[0] } });
  });
  $('#btn-logout').addEventListener('click', function(){ sb.auth.signOut(); });

  // ── Chargement ──
  async function loadProducts(){
    $('#loading').style.display='block';
    var r = await sb.from('products').select('*').order('sort_order');
    $('#loading').style.display='none';
    if(r.error){ toast('Erreur de chargement : '+r.error.message, true); return; }
    products = r.data || [];
    render();
  }

  // ── Rendu de la liste ──
  function render(){
    var list = $('#list'); list.innerHTML='';
    products.forEach(function(p){ list.appendChild(cardEl(p)); });
  }

  function cardEl(p){
    var card = document.createElement('div');
    card.className = 'card' + (p.active===false?' inactive':'');
    var opts = Array.isArray(p.options)?p.options:[];
    var priceTxt = opts.length ? (opts.map(function(o){return o.price+'€';}).join(' · ')) : '—';
    var thumb = (p.images&&p.images[0]) || 'images/kylian.jpg';
    card.innerHTML =
      '<div class="chead">'
      + '<img class="thumb" src="'+esc(thumb)+'" onerror="this.style.visibility=\'hidden\'">'
      + '<div class="t"><div class="nm">'+esc(p.name)+'</div><div class="cat">'+esc(p.category)+' · '+priceTxt+'</div></div>'
      + (p.promo_percent?('<span class="badge promo">-'+p.promo_percent+'%</span>'):'')
      + (p.active===false?'<span class="badge off">Masqué</span>':'')
      + '<span style="color:var(--muted);font-size:18px;">▾</span>'
      + '</div>'
      + '<div class="cbody"></div>';
    var head = card.querySelector('.chead');
    var body = card.querySelector('.cbody');
    head.addEventListener('click', function(){
      card.classList.toggle('open');
      if(card.classList.contains('open') && !body.dataset.built){ buildEditor(body, p); body.dataset.built='1'; }
    });
    return card;
  }

  // ── Éditeur d'un produit ──
  function buildEditor(body, p){
    var catOpts = CATEGORIES.map(function(c){return '<option '+(c===p.category?'selected':'')+'>'+esc(c)+'</option>';}).join('');
    body.innerHTML =
      '<div class="grid2">'
      + '<div><label class="fld">Nom</label><input class="f-name" value="'+esc(p.name)+'"></div>'
      + '<div><label class="fld">Catégorie</label><select class="f-cat">'+catOpts+'</select></div>'
      + '</div>'
      + '<label class="fld">Description</label><textarea class="f-desc" rows="2">'+esc(p.description||'')+'</textarea>'
      + '<div class="grid2" style="margin-top:14px;">'
      + '<div><label class="fld">Composition (une par ligne)</label><textarea class="f-comp" rows="4">'+esc((p.composition||[]).join('\n'))+'</textarea></div>'
      + '<div><label class="fld">Allergènes (un par ligne)</label><textarea class="f-alg" rows="4">'+esc((p.allergenes||[]).join('\n'))+'</textarea></div>'
      + '</div>'
      + '<label class="fld" style="margin-top:14px;">Formats & prix</label><div class="opts"></div>'
      + '<button class="add-opt" style="margin-top:2px;">+ Ajouter un format</button>'
      + '<div class="grid2" style="margin-top:16px;">'
      + '<div><label class="fld">Promo (%)</label><input class="f-promo" type="number" min="0" max="90" value="'+(p.promo_percent||0)+'"><div class="hint">0 = pas de promo</div></div>'
      + '<div><label class="fld">Visibilité</label><label class="switch"><input type="checkbox" class="f-active" '+(p.active!==false?'checked':'')+'> Afficher sur le site</label></div>'
      + '</div>'
      + '<label class="fld" style="margin-top:14px;">Photos</label><div class="imgs"></div>'
      + '<input type="file" accept="image/*" class="f-file" style="margin-top:6px;"><div class="hint">La 1ʳᵉ photo est la principale.</div>'
      + '<div class="actions"><button class="danger del">Supprimer ce gâteau</button><button class="primary save">Enregistrer</button></div>';

    // Formats
    var optsWrap = body.querySelector('.opts');
    function addOptRow(o){
      var row = document.createElement('div'); row.className='opt';
      row.innerHTML = '<input class="lbl" placeholder="ex. 4/6 personnes" value="'+esc(o&&o.label||'')+'">'
        + '<input class="prc" type="number" step="0.01" placeholder="prix €" value="'+(o&&o.price!=null?o.price:'')+'">'
        + '<button class="rm">✕</button>';
      row.querySelector('.rm').addEventListener('click', function(){ row.remove(); });
      optsWrap.appendChild(row);
    }
    (Array.isArray(p.options)?p.options:[]).forEach(addOptRow);
    if(!(p.options||[]).length) addOptRow({});
    body.querySelector('.add-opt').addEventListener('click', function(){ addOptRow({}); });

    // Photos
    var imgsWrap = body.querySelector('.imgs');
    var imgs = (p.images||[]).slice();
    function renderImgs(){
      imgsWrap.innerHTML='';
      imgs.forEach(function(url,i){
        var d=document.createElement('div'); d.className='im';
        d.innerHTML='<img src="'+esc(url)+'"><button>✕</button>';
        d.querySelector('button').addEventListener('click',function(){ imgs.splice(i,1); renderImgs(); });
        imgsWrap.appendChild(d);
      });
    }
    renderImgs();
    body.querySelector('.f-file').addEventListener('change', async function(e){
      var file=e.target.files[0]; if(!file) return;
      toast('Envoi de la photo…');
      var path = p.id + '/' + Date.now() + '-' + slugify(file.name.replace(/\.[^.]+$/,'')) + (file.name.match(/\.[^.]+$/)||[''])[0];
      var up = await sb.storage.from('product-images').upload(path, file, { upsert:false });
      if(up.error){ toast('Upload échoué : '+up.error.message, true); return; }
      var pub = sb.storage.from('product-images').getPublicUrl(path);
      imgs.push(pub.data.publicUrl); renderImgs(); toast('Photo ajoutée (pense à Enregistrer).');
      e.target.value='';
    });

    // Enregistrer
    body.querySelector('.save').addEventListener('click', async function(){
      var options=[];
      optsWrap.querySelectorAll('.opt').forEach(function(row){
        var l=row.querySelector('.lbl').value.trim(); var pr=parseFloat(row.querySelector('.prc').value);
        if(l && isFinite(pr)) options.push({label:l, price:pr});
      });
      var patch = {
        name: body.querySelector('.f-name').value.trim(),
        category: body.querySelector('.f-cat').value,
        description: body.querySelector('.f-desc').value.trim(),
        composition: body.querySelector('.f-comp').value.split('\n').map(function(x){return x.trim();}).filter(Boolean),
        allergenes: body.querySelector('.f-alg').value.split('\n').map(function(x){return x.trim();}).filter(Boolean),
        options: options,
        promo_percent: Math.max(0, Math.min(90, parseInt(body.querySelector('.f-promo').value,10)||0)),
        active: body.querySelector('.f-active').checked,
        images: imgs,
        updated_at: new Date().toISOString()
      };
      var r = await sb.from('products').update(patch).eq('id', p.id);
      if(r.error){ toast('Échec : '+r.error.message, true); return; }
      toast('✓ Enregistré'); loadProducts();
    });

    // Supprimer
    body.querySelector('.del').addEventListener('click', async function(){
      if(!confirm('Supprimer définitivement « '+p.name+' » ?')) return;
      var r = await sb.from('products').delete().eq('id', p.id);
      if(r.error){ toast('Échec : '+r.error.message, true); return; }
      toast('Supprimé'); loadProducts();
    });
  }

  // ── Nouveau produit ──
  $('#btn-new').addEventListener('click', async function(){
    var name = prompt('Nom du nouveau gâteau ?'); if(!name) return;
    var id = slugify(name);
    var maxSort = products.reduce(function(a,p){return Math.max(a, p.sort_order||0);},0);
    var row = { id:id, name:name, category:CATEGORIES[0], description:'', composition:[], allergenes:[],
      options:[], variants:[], images:[], active:true, promo_percent:0, sort_order:maxSort+10 };
    var r = await sb.from('products').insert(row);
    if(r.error){ toast('Échec : '+r.error.message + (r.error.message.match(/duplicate/i)?' (un gâteau a déjà cet identifiant)':''), true); return; }
    toast('Gâteau créé — complète ses infos'); await loadProducts();
    // ouvre la nouvelle carte
    var cards = document.querySelectorAll('.card');
    if(cards.length){ /* la nouvelle est en bas */ var last=cards[cards.length-1]; last.querySelector('.chead').click(); last.scrollIntoView({behavior:'smooth'}); }
  });

  init();
})();
</script>
</body>
</html>
