<head>

<title>Oups, pas de gourmandise ici · Atelier Givre</title>

<!-- Page « introuvable » : affiche la version du thème actif (404-normal.html,
     404-halloween.html, 404-noel.html), comme index.html pour le site. -->
<style>html,body{margin:0;background:#F5F7FA;}</style>
<script>
(function () {
  var THEMES = { normal: '/404-normal.html', halloween: '/404-halloween.html', noel: '/404-noel.html' };
  var SUPABASE_URL = 'https://viuojsmxtvgxmajmpzge.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_sLOg6MB-rq1858Xw0kp9pw_eQou1lQl';
  var memo = null; try { memo = localStorage.getItem('ag-theme'); } catch (e) {}
  var fait = false;
  function afficher(t) {
    if (fait) return; fait = true;
    fetch(THEMES[t] || THEMES.normal).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) { document.open(); document.write(html); document.close(); })
      .catch(function () { document.body.innerHTML = '<p style="font:18px Georgia,serif;text-align:center;margin-top:30vh">Oups… pas de gourmandise ici. <a href="/">Retour à l\'accueil</a></p>'; });
  }
  var secours = setTimeout(function () { afficher(THEMES[memo] ? memo : 'normal'); }, 1500);
  fetch(SUPABASE_URL + '/rest/v1/site_settings?key=eq.theme&select=value', { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (l) { var t = l && l[0] && l[0].value; return THEMES[t] ? t : 'normal'; })
    .catch(function () { return THEMES[memo] ? memo : 'normal'; })
    .then(function (t) { clearTimeout(secours); afficher(t); });
})();
</script>
