<style>

  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 70% at 50% 0%,#24183F 0%,#120F22 45%,var(--night) 100%);color:var(--frost);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden;}
  a{color:inherit;}
  .top{display:flex;align-items:center;padding:22px max(20px,env(safe-area-inset-left)) 0 max(20px,env(safe-area-inset-right));position:relative;z-index:3;}

  .eyebrow{display:flex;align-items:center;gap:12px;color:var(--pump-tx);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin:0 0 14px;}
  .eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:var(--pump);}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(36px,6vw,62px);line-height:1.05;margin:0 0 16px;text-wrap:balance;text-shadow:0 0 34px rgba(170,205,255,.16);}
  h1 em{color:var(--pump-tx);font-style:italic;text-shadow:0 0 22px rgba(240,138,46,.5);}
  p.lead{max-width:46ch;margin:0 auto 34px;font-size:16px;line-height:1.75;color:var(--body);}
  .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
  .btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:2px;font-size:13px;letter-spacing:1.3px;text-transform:uppercase;text-decoration:none;transition:transform .3s ease,background .3s ease,border-color .3s ease;}
  .btn:focus-visible{outline:2px solid var(--pump-tx);outline-offset:3px;}
  .btn.main{background:linear-gradient(135deg,#F08A2E 0%,#D9601A 100%);color:#fff;box-shadow:0 12px 30px -12px rgba(240,138,46,.75),inset 0 1px 0 rgba(255,214,170,.35);}
  .btn.main:hover{background:linear-gradient(135deg,#FFA24A 0%,#E46A1F 100%);transform:translateY(-2px);}
  .btn.ghost{border:1px solid rgba(238,244,250,.45);color:var(--frost);background:rgba(255,255,255,.04);}
  .btn.ghost:hover{border-color:var(--frost);background:rgba(255,255,255,.1);}
