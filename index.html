<!--
  Atelier Givre — choix du thème.
  Le site existe en plusieurs habillages (site-normal.html, site-halloween.html,
  site-noel.html). Le thème actif est choisi dans l'admin (table Supabase
  « site_settings », clé « theme ») ; cette page affiche la bonne version.
  Aperçu d'un thème sans l'activer : /?theme=noel (ou normal, halloween).
-->
<style>
  html,body{margin:0;height:100%;background:#F5F7FA;}
  .ag-attente{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font:400 15px/1.4 Georgia,serif;color:#8A98A5;letter-spacing:.5px;opacity:0;animation:ag-attente .3s ease .6s forwards;}
  @keyframes ag-attente{to{opacity:1;}}
</style>
<script>
(function () {
  var THEMES = { normal: 'site-normal.html', halloween: 'site-halloween.html', noel: 'site-noel.html' };
  var SUPABASE_URL = 'https://viuojsmxtvgxmajmpzge.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_sLOg6MB-rq1858Xw0kp9pw_eQou1lQl';
  var MEMO = 'ag-theme';
  var lire = function () { try { return localStorage.getItem(MEMO); } catch (e) { return null; } };
  var retenir = function (t) { try { localStorage.setItem(MEMO, t); } catch (e) {} };
  var page = function (t) { return fetch(THEMES[t], { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }); };

  var affiche = false;
  function afficher(theme, html) {
    if (affiche) return;
    affiche = true;
    (html || page(theme)).then(function (texte) {
      document.open(); document.write(texte); document.close();
    }).catch(function () {
      // Fichier du thème introuvable : on montre le site normal.
      if (theme !== 'normal') { affiche = false; afficher('normal'); } else { location.replace(THEMES.normal); }
    });
  }

  // Aperçu demandé dans l'adresse (?theme=noel) : rien n'est enregistré.
  var apercu = new URLSearchParams(location.search).get('theme');
  if (apercu && THEMES[apercu]) { afficher(apercu); return; }

  // Le dernier thème vu est chargé tout de suite, pendant qu'on demande à Supabase le thème actif.
  var memo = THEMES[lire()] ? lire() : 'normal';
  var enAvance = page(memo);
  enAvance.catch(function () {});
  var secours = setTimeout(function () { afficher(memo, enAvance); }, 2500);
  fetch(SUPABASE_URL + '/rest/v1/site_settings?key=eq.theme&select=value', {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
  }).then(function (r) { return r.ok ? r.json() : []; }).then(function (lignes) {
    var t = lignes && lignes[0] && lignes[0].value;
    return THEMES[t] ? t : 'normal';
  }).catch(function () { return memo; }).then(function (t) {
    clearTimeout(secours);
    retenir(t);
    afficher(t, t === memo ? enAvance : null);
  });
})();
</script>
